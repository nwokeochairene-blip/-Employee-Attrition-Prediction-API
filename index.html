<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attrition Predictor</title>
    <style>
        /* Basic styling - you can customize this */
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.3rem; font-weight: bold; }
        input, select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 0.7rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; }
        #result { margin-top: 1.5rem; padding: 1rem; border-radius: 4px; background: #f8f9fa; }
    </style>
</head>
<body>
    <h1>📊 Employee Attrition Prediction</h1>
    <form id="predictionForm">
        <!-- Replace these fields with your actual input features -->
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" required>
        </div>
        <div class="form-group">
            <label for="department">Department</label>
            <select id="department" name="department">
                <option value="Sales">Sales</option>
                <option value="R&D">R&D</option>
                <option value="HR">HR</option>
            </select>
        </div>
        <!-- Add more fields as needed -->
        <button type="submit">Predict</button>
    </form>
    <div id="result">Prediction will appear here.</div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Predicting...';

            // Collect form data into an object matching your API's expected format
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            // Convert numeric values if needed
            data.age = parseInt(data.age);

            try {
                // **REPLACE THIS URL with your actual prediction endpoint**
                const response = await fetch('https://employee-attrition-prediction-api-1.onrender.com/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);
                const result = await response.json();
                // **Adjust this based on your actual response structure**
                resultDiv.textContent = `Prediction: ${result.prediction || result.result || JSON.stringify(result)}`;
                resultDiv.style.background = '#d4edda';
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
                resultDiv.style.background = '#f8d7da';
            }
        });
    </script>
</body>
</html>
