<!DOCTYPE html>
<html>
<head>
    <title>Employee Attrition Predictor</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin: 10px 0; }
        label { display: inline-block; width: 200px; }
        input { padding: 5px; width: 200px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; padding: 20px; background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>Employee Attrition Predictor</h1>
    <form id="predictionForm">
        <div class="form-group">
            <label>Age:</label>
            <input type="number" id="Age" value="35">
        </div>
        <div class="form-group">
            <label>Monthly Income:</label>
            <input type="number" id="MonthlyIncome" value="5000">
        </div>
        <div class="form-group">
            <label>Years at Company:</label>
            <input type="number" id="YearsAtCompany" value="5">
        </div>
        <button type="submit">Predict</button>
    </form>
    <div id="result"></div>

    <script>
        document.getElementById('predictionForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                Age: parseInt(document.getElementById('Age').value),
                MonthlyIncome: parseInt(document.getElementById('MonthlyIncome').value),
                YearsAtCompany: parseInt(document.getElementById('YearsAtCompany').value)
            };
            
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            document.getElementById('result').innerHTML = `
                <h3>Result:</h3>
                <p>${result.prediction === 1 ? '⚠️ Likely to leave' : '✅ Likely to stay'}</p>
            `;
        };
    </script>
</body>
</html>
